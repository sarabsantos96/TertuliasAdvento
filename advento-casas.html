<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Advento das Tertúlias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Pacifico&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--w:clamp(44px,14vw,76px);--card:#ffffff;--text:#2b1d1d;--muted:#6d5b5b;--line:#e4d6c6;--red:#c0392b;--green:#1f6b4a;--field:#fbf4ec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#261f2e;--text:#f6ebe0;--muted:#b9a79a;--line:#3d3550;--field:#1a1620}}
:root[data-theme="dark"]{--card:#261f2e;--text:#f6ebe0;--muted:#b9a79a;--line:#3d3550;--field:#1a1620}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#fff;font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;background:linear-gradient(#0f4a35,#06241a) fixed #0a3526}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.85;
background-image:radial-gradient(3px 3px at 20px 30px,#fff,transparent),radial-gradient(2px 2px at 80px 120px,#fff,transparent),radial-gradient(3px 3px at 150px 60px,#fff,transparent),radial-gradient(2px 2px at 200px 180px,#fff,transparent);
background-size:220px 220px;animation:fall 14s linear infinite}
@keyframes fall{to{background-position:0 220px}}
.wrap{position:relative;max-width:560px;margin:0 auto;padding:18px 14px 36px;display:flex;flex-direction:column;align-items:center}
.santa{align-self:flex-start;font-size:1.6rem;animation:sway 4s ease-in-out infinite}
@keyframes sway{50%{transform:translateX(14px) rotate(-3deg)}}
h1{font-family:Fredoka,"Trebuchet MS",sans-serif;font-weight:600;font-size:clamp(1.3rem,5.5vw,1.8rem);margin:2px 0 14px;text-align:center}
.star{font-size:1.6rem;line-height:1;margin-bottom:-4px;animation:twinkle 2s ease-in-out infinite;position:relative;z-index:2}
@keyframes twinkle{50%{transform:scale(1.2);filter:brightness(1.3)}}
.rows{display:flex;flex-direction:column;align-items:center;gap:calc(var(--w)*.14)}
.row{display:flex;gap:4px;justify-content:center}
.trunk{width:34px;height:22px;background:linear-gradient(90deg,#5a3719,#8a5a30,#5a3719);border-radius:0 0 4px 4px}
.house{width:var(--w);height:calc(var(--w)*1.12);border:0;padding:0;cursor:pointer;position:relative;color:#fff;font-family:Fredoka,"Trebuchet MS",sans-serif;font-weight:600;
background:linear-gradient(#d93a34,#b3231f);border-radius:3px 3px 5px 5px;box-shadow:0 3px 6px rgba(0,0,0,.4);
display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:calc(var(--w)*.1);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.house::before{content:"";position:absolute;left:-3px;right:-3px;top:calc(var(--w)*-.12);height:calc(var(--w)*.22);background:#fff;border-radius:999px 999px 6px 6px;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.house .win{display:flex;gap:calc(var(--w)*.07);margin-bottom:calc(var(--w)*.06)}
.house .win i{display:block;width:calc(var(--w)*.17);height:calc(var(--w)*.2);background:#fff;border-radius:999px 999px 1px 1px;box-shadow:0 0 6px rgba(255,255,255,.8)}
.house .wd{font-size:clamp(.6rem,2.7vw,.92rem);letter-spacing:.2px}
.house .dt{font-size:clamp(.5rem,2.2vw,.72rem);font-weight:400;margin-top:1px}
.house.gold{background:linear-gradient(#f3c24a,#c08a12)}
.house.locked{filter:brightness(.55) saturate(.6)}
.house.locked .win i{background:#5a4a3a;box-shadow:none}
.house.today{animation:pulse 1.6s ease-in-out infinite}
.house.fresh{box-shadow:0 0 0 2px #fff,0 0 10px 2px rgba(255,255,255,.6)}
.house.seen::after{content:"✓";position:absolute;top:calc(var(--w)*.14);right:3px;width:calc(var(--w)*.27);height:calc(var(--w)*.27);border-radius:50%;background:#2e9e6a;color:#fff;font-size:calc(var(--w)*.18);font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-shadow:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:0 0 12px;font-size:.78rem;color:#cfe5d9}
@keyframes pulse{50%{box-shadow:0 0 0 3px #fff,0 0 18px 8px rgba(255,255,255,.85)}}
.title{font-family:Pacifico,"Segoe Script","Brush Script MT",cursive;font-size:clamp(2.6rem,12vw,3.8rem);margin:22px 0 0;line-height:1}
.name{font-family:Fredoka,"Trebuchet MS",sans-serif;font-size:1.1rem;margin:2px 0 8px}
.hint{color:#cfe5d9;font-size:.85rem;text-align:center;margin:6px 0 0}
.modal{position:fixed;inset:0;background:rgba(5,15,10,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal[hidden]{display:none}
.flip{width:100%;max-width:440px;perspective:1200px}
.inner{display:grid;transform-style:preserve-3d}
.inner.go{animation:flip .9s .35s cubic-bezier(.4,.1,.2,1) forwards}
@keyframes flip{to{transform:rotateY(180deg)}}
.face{grid-area:1/1;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.front{border-radius:18px;border:4px solid #fff;color:#fff;text-align:center;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:Fredoka,"Trebuchet MS",sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.45);background:radial-gradient(circle,rgba(255,255,255,.35) 0 2px,transparent 3px) 0 0/22px 22px,linear-gradient(#d93a34,#a3201a)}
.front .fw{font-size:1.7rem;font-weight:600}
.front .fd{font-size:1.15rem}
.card{transform:rotateY(180deg);background:var(--card);color:var(--text);border-radius:18px;max-width:440px;width:100%;padding:26px 22px 22px;position:relative;box-shadow:0 12px 40px rgba(0,0,0,.45);border-top:6px solid var(--red);max-height:90vh;overflow:auto}
.x{position:absolute;top:8px;right:12px;border:0;background:none;font-size:1.7rem;color:var(--muted);cursor:pointer;line-height:1}
.tag{display:inline-block;font-size:.75rem;background:var(--red);color:#fff;border-radius:999px;padding:2px 10px;margin-bottom:10px}
.card h2{margin:0 0 6px;font-family:Fredoka,"Trebuchet MS",sans-serif;font-weight:500;font-size:1.35rem;line-height:1.3}
.muted{color:var(--muted);font-size:.9rem}
button.act{font:inherit;background:var(--green);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;margin-top:12px}
input,textarea{width:100%;font:inherit;background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px}
#msg{font-size:.85rem;color:var(--green);margin-top:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.inner{transform:rotateY(180deg)}}
</style>
</head>
<body>
<div class="wrap">
<div class="santa" aria-hidden="true">🦌🛷🎅</div>
<h1>Advento de Natal das Tertúlias</h1>
<div class="legend"><span>✅ Já abri</span><span>✨ Por abrir</span><span>🔒 Ainda fechada</span></div>
<div class="star" aria-hidden="true">⭐</div>
<div class="rows" id="stage"></div>
<p class="title">Natal</p>
<p class="name">Calendário de desafios</p>
<p class="hint">Começa pela casinha de baixo e sobe até à estrela.<br>Toca no dia de hoje para abrir o desafio.</p>
</div>

<div class="modal" id="modal" hidden><div class="flip"><div class="inner" id="inner"><div class="face front" id="front"></div><div class="face card" id="card" role="dialog" aria-modal="true"></div></div></div></div>

<script>
// ====== CONFIGURAÇÃO (edita aqui) ======
var WHATSAPP = "00351969792898"; // ex.: "351912345678" (sem + nem espaços). Vazio = copia a mensagem para colar no grupo.
var START = new Date(2026, 10, 29); // domingo, 29 nov
var CHALLENGES = [
"Tira uma selfie com algo vermelho e manda ao grupo.",
"Envia uma mensagem de agradecimento a alguém com quem não falas há muito tempo.",
"Faz uma imitação de um animal e grava um vídeo de 10 segundos.",
"Veste uma peça de roupa ao contrário durante o dia todo e prova com uma foto.",
"Desenha o grupo de amigos em 2 minutos, sem tirar a caneta do papel.",
"Cozinha ou compra algo que nunca comeste e dá uma nota de 0 a 10.",
"Faz um elogio sincero a três pessoas diferentes.",
"Tira uma foto a algo que te faça lembrar o Natal, sem ser uma árvore.",
"Canta o refrão de uma música de Natal numa mensagem de voz.",
"Escreve um poema de 4 versos sobre um dos amigos do grupo.",
"Faz uma boa ação anónima e conta como foi (sem revelar a quem).",
"Recria uma foto antiga do grupo com a mesma pose.",
"Passa 1 hora sem telemóvel e conta o que fizeste.",
"Faz um embrulho criativo com materiais que tens em casa.",
"Conta uma história embaraçosa tua ao grupo.",
"Faz 20 agachamentos e envia prova em vídeo.",
"Inventa um cocktail ou chocolate quente e partilha a receita.",
"Escreve um postal de Natal à mão e tira uma foto.",
"Dança durante 30 segundos ao som de uma música à tua escolha.",
"Escolhe um amigo e propõe-lhe um mini desafio surpresa.",
"Desafio final: faz um vídeo curto a desejar boas festas a todo o grupo."
];
// ======================================
var hash = false, sim = false, today;
function readHash(){
  var h = location.hash, m = /^#dia-(\d{1,2})-(\d{1,2})$/.exec(h), n = new Date();
  hash = h === "#teste"; sim = !!m;
  today = m ? new Date(2026, +m[2] - 1, +m[1]) : new Date(n.getFullYear(), n.getMonth(), n.getDate());
}
readHash();
var WD = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
var WDFULL = ["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
var MFULL = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
var stage = document.getElementById("stage"), modal = document.getElementById("modal"), card = document.getElementById("card"), front = document.getElementById("front"), inner = document.getElementById("inner");
var STARTS = [20,18,15,11,6,0]; // primeiro dia de cada fila (de cima, 1 casa, até baixo, 6 casas)
var LAST = CHALLENGES.length - 1;
var MON = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
var SEEN = {};
try { SEEN = JSON.parse(localStorage.getItem("advento-vistos") || "{}") || {}; } catch (e) { SEEN = {}; }
function markSeen(i){
  if (SEEN[i]) return;
  SEEN[i] = 1;
  if (!hash && !sim) { try { localStorage.setItem("advento-vistos", JSON.stringify(SEEN)); } catch (e) {} }
  render();
}

function dayDate(i){ return new Date(START.getFullYear(), START.getMonth(), START.getDate() + i); }
function full(d){ return WDFULL[d.getDay()] + ", " + d.getDate() + " de " + MFULL[d.getMonth()]; }
function state(i){
  if (hash) return "open";
  var t = dayDate(i).getTime();
  return t === today.getTime() ? "today" : (t < today.getTime() ? "open" : "locked");
}
function house(i){
  var s = state(i), b = document.createElement("button");
  b.className = "house" + (i === LAST ? " gold" : "") + (s === "locked" ? " locked" : (SEEN[i] ? " seen" : " fresh")) + (s === "today" ? " today" : "");
  b.setAttribute("aria-label", full(dayDate(i)));
  b.innerHTML = '<span class="win"><i></i><i></i><i></i></span><span class="wd">' + WD[dayDate(i).getDay()] + '</span><span class="dt">' + dayDate(i).getDate() + ' ' + MON[dayDate(i).getMonth()] + '</span>';
  b.addEventListener("click", function(){ openDay(i); });
  return b;
}
function render(){
  stage.innerHTML = "";
  for (var r = 1; r <= 6; r++){
    var row = document.createElement("div"); row.className = "row";
    for (var k = 0; k < r; k++) row.appendChild(house(STARTS[r - 1] + k));
    stage.appendChild(row);
  }
  var trunk = document.createElement("div"); trunk.className = "trunk"; stage.appendChild(trunk);
}
function closeModal(){ modal.hidden = true; }
function openDay(i){
  var s = state(i), d = dayDate(i);
  var head = '<button class="x" id="x" aria-label="Fechar">×</button>';
  if (s === "locked"){
    var n = Math.round((d.getTime() - today.getTime()) / 86400000);
    card.innerHTML = head + '<span class="tag">' + full(d) + '</span><h2>🔒 Ainda está fechado</h2><p class="muted">Abre daqui a ' + n + (n === 1 ? ' dia' : ' dias') + '. Pachorra!</p>';
  } else {
    card.innerHTML = head + '<span class="tag">' + (i === LAST ? '⭐ Desafio final · ' : '') + full(d) + '</span><h2>' + CHALLENGES[i] + '</h2>' +
      '<button class="act" id="go">Já fiz! Enviar a prova</button><div id="form"></div>';
    document.getElementById("go").addEventListener("click", function(){ showForm(i); });
  }
  document.getElementById("x").addEventListener("click", closeModal);
  front.innerHTML = '<div style="font-size:3rem">' + (i === LAST ? '⭐' : '🎁') + '</div><div class="fw">' + WDFULL[d.getDay()] + '</div><div class="fd">' + d.getDate() + ' de ' + MFULL[d.getMonth()] + '</div>';
  inner.className = "inner";
  modal.hidden = false;
  void inner.offsetWidth;
  inner.className = "inner go";
  document.getElementById("x").focus();
  if (s !== "locked") markSeen(i);
}
function showForm(i){
  document.getElementById("go").style.display = "none";
  document.getElementById("form").innerHTML =
    '<p class="muted">Escreve o teu nome e, no WhatsApp, junta a foto ou o vídeo do desafio e envia.</p>' +
    '<input id="nome" placeholder="O teu nome">' +
    '<textarea id="txt" rows="3" placeholder="Conta como foi (anexa a foto ou vídeo na mensagem)"></textarea>' +
    '<button class="act" id="send">' + (WHATSAPP ? 'Abrir WhatsApp' : 'Copiar mensagem') + '</button><div id="msg"></div>';
  document.getElementById("send").addEventListener("click", function(){
    var nome = document.getElementById("nome").value.trim(), txt = document.getElementById("txt").value.trim(), out = document.getElementById("msg");
    if (!nome){ out.textContent = "Diz-nos o teu nome."; return; }
    var m = "Advento das Tertúlias · " + full(dayDate(i)) + " · " + nome + (txt ? ": " + txt : "");
    if (WHATSAPP){ window.open("https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(m), "_blank"); return; }
    try { navigator.clipboard.writeText(m).then(function(){ out.textContent = "Mensagem copiada! Cola-a no chat do grupo e anexa a prova."; }); }
    catch (e) { out.textContent = m; }
  });
}
modal.addEventListener("click", function(e){ if (e.target === modal) closeModal(); });
document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeModal(); });
window.addEventListener("hashchange", function(){ readHash(); closeModal(); render(); });
render();
</script>
</body>
</html>
